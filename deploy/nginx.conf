server {
    listen 80;
    server_name _;

    # Angular static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API proxy — all backend routes
    location ~ ^/(auth|vendors|enrich|quotations|procurement|sourcing|customers|inbound|contracts|dashboard|notifications|users|health|uploads|whatsapp|documents|contact-logs) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # Angular — all other routes served as SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
